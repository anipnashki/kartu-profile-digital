<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Pina</title>

    <!-- Menghubungkan HTML dengan CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Kartu kontainer utama -->
    <div class="profile-card">

        <!-- Badge status aktif -->
        <span class="badge">Ready to Code</span>

        <!-- Foto profil -->
        <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBhf6FkbZbZqccyf7UXWSqVVUUa-jLj51hi86D0WOEig&s=10"
            alt="Foto Profil Pina"
            class="profile-img"
        >

        <!-- Nama dan peran -->
        <h1>Pina</h1>

        <p class="role">
            UI/UX Designer & Student RPL
        </p>

        <!-- Bio -->
        <p class="bio">
            Suka bikin tampilan web yang estetik,
            hobi menyanyi.
        </p>

        <!-- Tombol media sosial -->
        <div class="social-links">

            <a
                href="https://github.com/anipnashki"
                target="_blank"
                class="btn github"
            >
                💻 GitHub Pina
            </a>

            <a
                href="https://instagram.com/USERNAME_INSTAGRAM"
                target="_blank"
                class="btn instagram"
            >
                📷 Instagram Pina
            </a>

        </div>

    </div>

    <!-- Menghubungkan HTML dengan JavaScript -->
    <script src="script.js"></script>

</body>

</html>
